name: Release BigWigs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
        type: string
      draft:
        description: 'Publish as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Publish as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package and Release Addon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION_CLEAN=$(echo ${TAG} | sed 's/^v//')" >> "$GITHUB_ENV"

      - name: Package BigWigs Distribution Zip
        run: |
          mkdir -p dist
          python tools/package_release.py --version "${VERSION_CLEAN}" --output-dir dist

      - name: Collect Release Assets
        id: assets
        run: |
          ASSETS="dist/*.zip"
          if [ -f "BigWigs_RaidLeader_Briefing.pdf" ]; then
            ASSETS="${ASSETS}"$'\n'"BigWigs_RaidLeader_Briefing.pdf"
          fi
          if [ -f "BigWigs_30141_Report.pdf" ]; then
            ASSETS="${ASSETS}"$'\n'"BigWigs_30141_Report.pdf"
          fi
          {
            echo "RELEASE_FILES<<EOF"
            echo "${ASSETS}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BigWigs ${{ env.RELEASE_TAG }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: ${{ env.RELEASE_FILES }}
